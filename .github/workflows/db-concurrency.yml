name: DB concurrency

# Real two-session PostgreSQL tests for the decision J migrations
# (src/lib/__tests__/db-withdraw-concurrency.test.ts): uploads, withdrawals,
# account deletion and the consent allowance racing each other. PGlite has one
# session, so these need a real server: a DISPOSABLE PostgreSQL 17 service
# container that exists only for this job and is discarded with it.
#
# Not a required check (owner decision, 2026-11-28). Read-only permissions, no
# repository secrets, never deploys, never contacts Supabase: the test refuses
# any ATLAS_TEST_PG_URL that isn't on localhost or 127.0.0.1, and
# ATLAS_REQUIRE_PG makes it fail (instead of skipping) if the database isn't set.

on:
  pull_request:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-concurrency:
    name: db-concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # The password of a throwaway container on the runner, not a secret.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATLAS_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ATLAS_REQUIRE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Real two-session concurrency tests
        run: npx vitest run src/lib/__tests__/db-withdraw-concurrency.test.ts
